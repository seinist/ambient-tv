[package]
name = "ambientsvp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vulkan"]
vulkan = ["dep:wgpu", "dep:pollster", "dep:ash", "dep:naga"]

[dependencies]
svpflow1 = { git = "https://github.com/Z1xus/open-svpflow", rev = "badc0debd33fe4034d0557bc736b9e0b7cfaf784" }
svpflow-core = { git = "https://github.com/Z1xus/open-svpflow", rev = "badc0debd33fe4034d0557bc736b9e0b7cfaf784" }
rayon = "1.12"
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl", "vulkan-portability"], optional = true }
pollster = { version = "0.4", optional = true }
# Use the exact Vulkan/SPIR-V dependencies already present in the wgpu lock.
ash = { version = "=0.38.0", default-features = false, features = ["loaded"], optional = true }
naga = { version = "=24.0.0", features = ["wgsl-in", "spv-out"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.3.1"

# The original wrapper is retained as a bit-exact reference for tests only.
[dev-dependencies]
svpflow-wasm = { git = "https://github.com/Z1xus/open-svpflow", rev = "badc0debd33fe4034d0557bc736b9e0b7cfaf784" }

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "android")'.dependencies.libc]
version = "=0.2.189"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

