name: SmartTube integration

on:
  pull_request:
    paths:
      - '.github/workflows/smarttube-integration.yml'
      - 'scripts/**'
      - 'build.sh'
      - 'smarttube_wrappers/**'
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'app/src/main/java/com/ambient/tv/youtube/**'
      - 'app/src/test/java/com/ambient/tv/youtube/**'
      - 'app/src/main/java/com/ambient/tv/ui/youtube/**'
      - 'app/src/test/java/com/ambient/tv/ui/youtube/**'
      - 'app/src/main/java/com/ambient/tv/ui/player/RenewingMedia3DataSource.kt'
      - 'app/src/test/java/com/ambient/tv/ui/player/RenewingMedia3DataSourceTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarttube-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smarttube:
    runs-on: ubuntu-latest
    # Allow bounded dependency-resolution retries without hiding test failures.
    timeout-minutes: 65
    env:
      SKIP_MPV_NATIVE: '1'
      ROBOLECTRIC_MAVEN_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.1" "platforms;android-37.0" "ndk;30.0.16248370" "cmake;3.22.1" ||
            "$sdkmanager" --channel=3 "platforms;android-37.1" "platforms;android-37.0" "ndk;30.0.16248370" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch and patch pinned upstream sources
        run: |
          bash scripts/fetch_smarttube_engine.sh
          bash scripts/fetch_libretrodroid.sh
          python3 scripts/patch_smarttube_compat.py --check --root third_party/smarttube
      - name: Resolve actual AARs and reject duplicate classes before unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_maven_updates.py'
          bash scripts/ci_gradle_rate_limit_retry.sh :app:checkDebugDuplicateClasses :app:checkReleaseDuplicateClasses \
            -PAPK_ABI=arm64 --no-configuration-cache --stacktrace --continue
      - name: Verify release R8 with actual dependency classes
        run: |
          bash scripts/ci_gradle_rate_limit_retry.sh :app:minifyReleaseWithR8 -PAPK_ABI=arm64 -PADB_DEPLOY=false \
            --no-configuration-cache --stacktrace
      - name: Test DNS provider compatibility
        run: |
          bash scripts/ci_gradle_rate_limit_retry.sh :sharedutils:testDebugUnitTest -PAPK_ABI=arm64 --stacktrace
      - name: Test the patched SmartTube account and format paths
        run: |
          bash scripts/ci_gradle_rate_limit_retry.sh :youtubeapi:testDebugUnitTest --tests '*AuthHeaderSnapshotTest' --tests '*SmartTubeFormatBridgeTest' --tests '*SmartTubeJsonPathCompatibilityTest' -PAPK_ABI=arm64
      - name: Verify the application runtime dependency graph
        run: |
          set -euo pipefail
          for variant in debug release; do
            bash scripts/ci_gradle_rate_limit_retry.sh :app:dependencies --configuration "${variant}RuntimeClasspath" -PAPK_ABI=arm64 | tee "cronet-${variant}-graph.log"
            if grep -Eq ' FAILED([[:space:]]|$)' "cronet-${variant}-graph.log"; then
              echo "::error::Unresolved runtime dependency"
              exit 1
            fi
          done
      - name: Test SmartTube playback, relay and reflection
        run: |
          bash scripts/ci_gradle_rate_limit_retry.sh :app:testDebugUnitTest -PAPK_ABI=arm64 \
            --tests '*SmartTube*' --tests '*YouTube*' \
            --tests '*ChunkedStreamRelayTest' --tests '*RenewingMedia3DataSourceTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smarttube-test-reports
          path: |
            smarttube_wrappers/youtubeapi/build/test-results/
            smarttube_wrappers/sharedutils/build/test-results/
            app/build/outputs/mapping/release/
            app/build/test-results/
          if-no-files-found: warn
