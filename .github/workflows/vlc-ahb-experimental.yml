name: Experimental VLC Android hardware buffer
on:
  pull_request:
    paths:
      - 'native/vlc-aar/experimental/**'
      - 'native/vlc-aar/patches/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/ambient/tv/ui/player/backend/VlcPlaybackView.kt'
      - 'app/src/main/java/com/ambient/tv/ui/player/backend/VideoAccelerationPolicy.kt'
      - 'app/src/test/java/com/ambient/tv/ui/player/backend/VlcAhbExperimentPolicyTest.kt'
      - 'app/src/main/java/com/ambient/tv/ui/player/backend/VlcTimedMetadata*.kt'
      - 'app/src/test/java/com/ambient/tv/ui/player/backend/VlcTimedMetadataTest.kt'
      - 'app/src/androidTest/java/com/ambient/tv/ui/player/VlcMetadataSocketAudit.kt'
      - 'app/src/androidTest/java/com/ambient/tv/ui/player/PlaybackAuditInstrumentation.kt'
      - 'scripts/test_vlc_ahb_import.sh'
      - 'scripts/prepare_vlc_ahb_experimental.sh'
      - 'scripts/build_vlc_vulkan.sh'
      - 'scripts/run_vlc_seek_e2e.sh'
      - 'native/vlc-aar/seek-audit/**'
      - '.github/workflows/vlc-ahb-experimental.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndk-contract:
    concurrency:
      group: vlc-ahb-contract-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: v5.264.1
          path: .ci/libplacebo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: videolan/vlc
          ref: c84ef1eda4f14f8b57a5b266b51c843cf51ed28b
          path: .ci/vlc
          persist-credentials: false
      - name: Apply reviewed production VLC patches before contract checks
        run: |
          for patch in "$GITHUB_WORKSPACE"/native/vlc-aar/patches/*.patch; do
            git -C .ci/vlc apply "$patch"
          done
          # Check sequential applicability, as actual staging does. A single
          # git apply --check with many patches can miss conflicting hunks
          # against the same original file.
          for patch in "$GITHUB_WORKSPACE"/native/vlc-aar/experimental/vlc-patches/*.patch; do
            echo "Checking experimental patch: $(basename "$patch")"
            git -C .ci/vlc apply --check "$patch"
            git -C .ci/vlc apply "$patch"
          done
          # Staging below must recognize the already applied series. It also
          # generates shaders, copies headers and applies the contrib changes.
      - name: Install pinned Android NDK and shader compiler
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          echo "sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;30.0.16248370" || "$sdkmanager" --channel=3 "ndk;30.0.16248370"
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -o Acquire::Retries=3
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y glslc libvulkan-dev
      - name: Stage experimental display module and embedded shaders
        run: |
          touch .ci/vlc/.ambient-ahb-experimental
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash scripts/prepare_vlc_ahb_experimental.sh .ci/vlc
          bash scripts/prepare_vlc_ahb_experimental.sh .ci/vlc
          # Production patch files include pre-existing whitespace in nested
          # contrib patches; validate only the experimental staging delta.
          git -C .ci/vlc diff --check -- modules/video_output modules/codec/omxil src/video_output
      - name: Host sanitizer regressions, GLSL and Android ABI checks
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export LIBPLACEBO_SOURCE="$GITHUB_WORKSPACE/.ci/libplacebo"
          export VLC_SOURCE="$GITHUB_WORKSPACE/.ci/vlc"
          bash -n scripts/build_vlc_vulkan.sh scripts/prepare_vlc_ahb_experimental.sh
          normal_hash="$(bash scripts/build_vlc_vulkan.sh --hash)"
          experimental_hash="$(VLC_EXPERIMENTAL_AHB=1 bash scripts/build_vlc_vulkan.sh --hash)"
          [[ "$normal_hash" != "$experimental_hash" ]]
          bash scripts/test_vlc_ahb_import.sh

  ffmpeg-rpu-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: FFmpeg/FFmpeg
          ref: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          path: .ci/ffmpeg
          persist-credentials: false
      - name: Install encoder for synthetic Main10 EL fixture
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -o Acquire::Retries=3
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y ffmpeg
      - name: Compile and exercise the real pinned FFmpeg RPU parser
        run: |
          cd .ci/ffmpeg
          git apply "$GITHUB_WORKSPACE/native/vlc-aar/experimental/ffmpeg-patches/ambient-dovi-parser.patch"
          ./configure --disable-everything --disable-autodetect --disable-programs --disable-doc --disable-network --disable-x86asm --disable-shared --enable-static --enable-decoder=hevc --enable-bsf=dovi_rpu,dovi_split --disable-avdevice --disable-avfilter --disable-swscale --disable-swresample --disable-avformat
          make -j2 libavcodec/libavcodec.a libavutil/libavutil.a
          cc -I . -I libavcodec -I "$GITHUB_WORKSPACE/native/vlc-aar/experimental" "$GITHUB_WORKSPACE/native/vlc-aar/experimental/test_ambient_dovi_parser.c" libavcodec/libavcodec.a libavutil/libavutil.a -lm -pthread -o test-ambient-dovi
          ./test-ambient-dovi
          cc -std=c11 -I . "$GITHUB_WORKSPACE/native/vlc-aar/experimental/test_hdr10plus_ffmpeg.c" libavutil/libavutil.a -lm -pthread -o test-hdr10plus-ffmpeg
          ./test-hdr10plus-ffmpeg
          cc -I . "$GITHUB_WORKSPACE/native/vlc-aar/experimental/test_dovi_split.c" libavcodec/libavcodec.a libavutil/libavutil.a -lm -pthread -o test-dovi-split
          ./test-dovi-split
          # Real independently encoded Main10 picture, wrapped as type-63 EL.
          # The system encoder is only for a test fixture; decoding uses the pinned static FFmpeg.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=64x64:r=1 -frames:v 1 -pix_fmt yuv420p10le -c:v libx265 -x265-params 'pools=1:frame-threads=1:repeat-headers=1:log-level=error' -f hevc -y test-el.hevc
          cc -I . "$GITHUB_WORKSPACE/native/vlc-aar/experimental/test_dovi_fel_decoder.c" libavcodec/libavcodec.a libavutil/libavutil.a -lm -pthread -o test-fel-decoder
          # Encode a genuine B-frame GOP; take packet PTS/DTS from MP4 and
          # keep access-unit boundaries via AUD in the Annex B stream.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=64x64:r=24 -frames:v 8 -pix_fmt yuv420p10le -c:v libx265 -x265-params 'pools=1:frame-threads=1:repeat-headers=1:aud=1:bframes=2:b-adapt=0:keyint=8:min-keyint=8:scenecut=0:log-level=error' -y test-el-reorder.mp4
          ffprobe -v error -select_streams v:0 -show_entries packet=pts,dts -of csv=p=0 test-el-reorder.mp4 > test-el-reorder.csv
          ffmpeg -hide_banner -loglevel error -i test-el-reorder.mp4 -map 0:v:0 -c copy -bsf:v hevc_mp4toannexb -f hevc -y test-el-reorder.hevc
          ffmpeg -hide_banner -loglevel error -i test-el-reorder.mp4 -map 0:v:0 -pix_fmt yuv420p10le -f rawvideo -y test-el-reorder.yuv
          ffmpeg -hide_banner -loglevel error -i test-el.hevc -c copy -bsf:v hevc_metadata=crop_right=2:crop_bottom=4 -f hevc -y test-el-pad.hevc
          ffmpeg -hide_banner -loglevel error -i test-el.hevc -c copy -bsf:v hevc_metadata=crop_left=2:crop_top=4 -f hevc -y test-el-shift.hevc
          ./test-fel-decoder test-el.hevc test-el-reorder.hevc test-el-reorder.csv test-el-reorder.yuv test-el-pad.hevc test-el-shift.hevc

  hdrplus-spatial-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: v5.264.1
          path: .ci/libplacebo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: videolan/vlc
          ref: c84ef1eda4f14f8b57a5b266b51c843cf51ed28b
          path: .ci/vlc-hdr
          persist-credentials: false
          sparse-checkout: |
            include
            modules/video_output/libplacebo
            modules/video_output/opengl
      - name: Install host Vulkan and libplacebo build dependencies
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -o Acquire::Retries=3
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y meson ninja-build python3-jinja2 libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers libshaderc-dev
      - name: Build pinned libplacebo and render local-window reference fixture
        run: |
          git -C .ci/libplacebo apply "$GITHUB_WORKSPACE/native/vlc-aar/experimental/libplacebo-patches/ambient-mmr-order3.patch"
          meson setup .ci/pl-build .ci/libplacebo -Dvulkan=enabled -Dshaderc=enabled -Dglslang=disabled -Dopengl=disabled -Ddemos=false -Dtests=false -Dlcms=disabled -Dlibdovi=disabled -Dunwind=disabled
          meson compile -C .ci/pl-build -j2
          cc -std=c11 -I .ci/libplacebo/src/include -I .ci/pl-build/src/include \
            native/vlc-aar/experimental/test_hdr10plus_spatial_gpu.c \
            -L .ci/pl-build/src -Wl,-rpath,"$PWD/.ci/pl-build/src" -lplacebo -lm -o .ci/test-hdrplus-spatial
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation .ci/test-hdrplus-spatial
          cc -std=c11 -I .ci/libplacebo/src/include -I .ci/pl-build/src/include \
            native/vlc-aar/experimental/test_dovi_fel_gpu.c \
            -L .ci/pl-build/src -Wl,-rpath,"$PWD/.ci/pl-build/src" -lplacebo -lm -o .ci/test-dovi-fel
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation .ci/test-dovi-fel
          python3 native/vlc-aar/experimental/generate_hdr_reference.py > .ci/hdr_reference_vectors.h
          cc -std=c11 -I .ci -I .ci/libplacebo/src/include -I .ci/pl-build/src/include \
            native/vlc-aar/experimental/test_hdr_reference_gpu.c \
            -L .ci/pl-build/src -Wl,-rpath,"$PWD/.ci/pl-build/src" -lplacebo -lm -o .ci/test-hdr-reference
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation .ci/test-hdr-reference
          git -C .ci/vlc-hdr apply "$GITHUB_WORKSPACE/native/vlc-aar/experimental/vlc-patches/utils-hdr-units.patch"
          # Link the actual shared adapter, retaining only the functions under test.
          clang -std=gnu11 -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -DMODULE_NAME=libplacebo '-DN_(s)=s' \
            -ffunction-sections -fdata-sections -fsanitize=undefined -fno-sanitize-recover=all \
            -I .ci/vlc-hdr/include -I .ci/vlc-hdr/modules/video_output/libplacebo \
            -I .ci/libplacebo/src/include -I .ci/pl-build/src/include \
            .ci/vlc-hdr/modules/video_output/libplacebo/utils.c native/vlc-aar/experimental/test_vlc_hdr_units.c \
            -Wl,--gc-sections -L .ci/pl-build/src -Wl,-rpath,"$PWD/.ci/pl-build/src" -lplacebo -lm -o .ci/test-vlc-hdr-units
          .ci/test-vlc-hdr-units

  linked-arm64-aar:
    # Only the repository-owned experiment or integration branch can spend time building the
    # whole native stack. No release credentials or publishing step.
    if: github.event_name == 'workflow_dispatch' || ((github.head_ref == 'experiment/vlc-vulkan-ahb-import' || github.head_ref == 'fix/video-renderer-deep-audit-20261126') && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [ndk-contract, ffmpeg-rpu-contract, hdrplus-spatial-gpu]
    # Let an expensive linked build finish even while a newer commit is
    # audited. GitHub keeps only the newest queued build in this group.
    concurrency:
      group: vlc-ahb-linked-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      NATIVE_JOBS: '2'
      CARGO_BUILD_JOBS: '2'
      VLC_EXPERIMENTAL_AHB: '1'
      VLC_VULKAN_ABIS: arm64-v8a
      VLC_NATIVE_LINK_RECEIPT: native/vlc-aar/build/experimental/native-link-receipt.txt
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -o Acquire::Retries=3
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y build-essential autoconf automake autopoint gettext libtool libtool-bin \
            pkg-config ninja-build cmake gperf nasm yasm bison flex texinfo \
            curl wget unzip zip xz-utils patch perl python3 python3-venv libssl-dev glslang-tools glslc
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install pinned Meson and SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install --disable-pip-version-check 'meson==1.11.0'
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # This job only runs on the repository-owned experiment branch
          # or a manual dispatch. PR caches remain scoped to their merge ref.
          cache-read-only: false
      - name: Build full linked VLC and JNI AAR (arm64)
        run: |
          bash scripts/build_vlc_vulkan.sh
          aar=native/vlc-aar/build/experimental/libvlc-vulkan-ahb-experimental.aar
          unzip -tq "$aar"
          unzip -Z1 "$aar" | grep -Fx jni/arm64-v8a/libvlc.so
          unzip -Z1 "$aar" | grep -Fx jni/arm64-v8a/libvlcjni.so
      - name: Build seek audit APK against the newly linked AAR
        run: |
          bash scripts/run_vlc_seek_e2e.sh --prepare-only
      - uses: actions/upload-artifact@v5
        with:
          name: vlc-seek-audit-arm64
          path: |
            native/vlc-aar/seek-audit/build/outputs/apk/debug/seek-audit-debug.apk
            native/vlc-aar/seek-audit/build/seek-fixture.mp4
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: vlc-ahb-experimental-arm64
          path: native/vlc-aar/build/experimental/libvlc-vulkan-ahb-experimental.aar
          if-no-files-found: error
          retention-days: 7
      - name: Retain verified native libraries if packaging fails
        if: ${{ failure() && hashFiles('native/vlc-aar/build/experimental/native-link-receipt.txt') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: vlc-ahb-native-link-only-arm64-not-aar
          path: |
            native/vlc-aar/build/experimental/native-link-receipt.txt
            .native/libvlcjni-ahb-experimental/libvlc/jni/libs/arm64-v8a/libvlc.so
            .native/libvlcjni-ahb-experimental/libvlc/jni/libs/arm64-v8a/libvlcjni.so
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
