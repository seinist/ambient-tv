name: Experimental VLC Android hardware buffer
on:
  pull_request:
    paths:
      - 'native/vlc-aar/experimental/**'
      - 'scripts/test_vlc_ahb_import.sh'
      - 'scripts/prepare_vlc_ahb_experimental.sh'
      - '.github/workflows/vlc-ahb-experimental.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: v5.264.1
          path: .ci/libplacebo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: videolan/vlc
          ref: c84ef1eda4f14f8b57a5b266b51c843cf51ed28b
          path: .ci/vlc
          persist-credentials: false
      - name: Check experimental patch against pinned VLC
        run: |
          git -C .ci/vlc apply --check "$GITHUB_WORKSPACE"/native/vlc-aar/experimental/vlc-patches/*.patch
      - name: Install pinned Android NDK and shader compiler
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          echo "sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;30.0.16248370" || "$sdkmanager" --channel=3 "ndk;30.0.16248370"
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev
      - name: Stage experimental display module and embedded shaders
        run: |
          touch .ci/vlc/.ambient-ahb-experimental
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash scripts/prepare_vlc_ahb_experimental.sh .ci/vlc
          bash scripts/prepare_vlc_ahb_experimental.sh .ci/vlc
          git -C .ci/vlc diff --check
      - name: Host sanitizer regressions, GLSL and Android ABI checks
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export LIBPLACEBO_SOURCE="$GITHUB_WORKSPACE/.ci/libplacebo"
          bash scripts/test_vlc_ahb_import.sh
