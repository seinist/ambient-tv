name: Cores

# Builds the pinned libretro cores of cores/cores.json from source with the app's NDK (16 KB
# pages checked) and, when publishing, puts them into a signed "cores-…" release. The app's
# "Ambient TV build" core channel reads that release: manifest.json signed with the key whose
# public half is in cores/signing-public.pem (secret CORES_SIGNING_KEY, PEM, EC P-256).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed cores release
        type: boolean
        default: false
      cores:
        description: Core ids to build, comma separated (empty = all)
        default: ""
      abis:
        description: Android ABIs, comma separated (empty = all)
        default: ""
      profile:
        description: Compiler profile (non-baseline is artifact-only)
        type: choice
        options: [baseline, o3, thinlto, o3-thinlto, tune-a57, picodrive-sh2]
        default: baseline
      comparison:
        description: Paired full-catalog builds (artifact-only; baseline profile required)
        type: choice
        options: [none, baseline-thinlto, o3-o3-thinlto]
        default: none
  pull_request:
    paths:
      - cores/cores.json
      - .github/workflows/cores.yml
      - scripts/core_build_policy.py
      - scripts/core_acceleration_audit.py
      - scripts/core_link_evidence.py
      - scripts/test_core_build_policy.py
      - scripts/check_elf_pages.py
  push:
    branches: [main]
    paths:
      - cores/cores.json
      - .github/workflows/cores.yml
      - scripts/check_elf_pages.py
      - scripts/core_build_policy.py
      - scripts/core_acceleration_audit.py
      - scripts/core_link_evidence.py
      - scripts/test_core_build_policy.py

concurrency:
  group: cores-${{ github.ref }}-${{ (github.event_name == 'push' || inputs.publish) && 'release' || format('{0}-{1}', inputs.profile || 'baseline', inputs.comparison || 'none') }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "30.0.16248370"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Test core build policy
        run: python3 -m unittest discover -s scripts -p test_core_build_policy.py
      - id: plan
        env:
          ONLY: ${{ inputs.cores }}
          ABIS: ${{ inputs.abis }}
          PROFILE: ${{ inputs.profile || 'baseline' }}
          PUBLISH: ${{ inputs.publish }}
          COMPARISON: ${{ inputs.comparison || 'none' }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/core_build_policy.py plan --catalog cores/cores.json \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --publish "$PUBLISH" \
            --cores "$ONLY" --abis "$ABIS" --profile "$PROFILE" --comparison "$COMPARISON")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[] | "\(.core) \(.abi) \(.profile)"'
      # Check the secret BEFORE spending 104 core-build jobs on a release that cannot
      # be signed. Never generate a new key or publish unsigned native libraries.
      - name: Check core-release signing key
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          SIGNING_KEY: ${{ secrets.CORES_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || {
            echo "::error::CORES_SIGNING_KEY is missing. Add the existing private PEM matching cores/signing-public.pem to Actions secrets."
            exit 1
          }
          key="$RUNNER_TEMP/ambient-cores-key.pem"
          pub="$RUNNER_TEMP/ambient-cores-public.pem"
          trap 'rm -f "$key" "$pub"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$pub"
          cmp -s "$pub" cores/signing-public.pem || {
            echo "::error::CORES_SIGNING_KEY does not match the committed public key"
            exit 1
          }

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.core }} (${{ matrix.abi }}, ${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v5

      - name: Install NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;${NDK_VERSION}" > /dev/null || "$sdkmanager" --channel=3 "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up content-checked compiler cache
        run: |
          command -v ccache >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          }
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=512M
          ccache --set-config=compression=true
          echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: core-ccache-v1-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ matrix.core }}-${{ matrix.commit }}-${{ matrix.abi }}-${{ matrix.profile }}-${{ hashFiles('cores/cores.json', '.github/workflows/cores.yml', 'scripts/core_build_policy.py', 'scripts/core_acceleration_audit.py', 'scripts/core_link_evidence.py') }}

      - name: Fetch ${{ matrix.core }} at its pinned commit
        env:
          CORE_REPO: ${{ matrix.repo }}
          CORE_COMMIT: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          git init -q src
          git -C src remote add origin "$CORE_REPO"
          git -C src fetch -q --depth 1 origin "$CORE_COMMIT"
          git -C src checkout -q FETCH_HEAD
          # Direct submodules are needed; some cores carry broken nested ones (mupen64plus-nx), which
          # libretro's own CI does not fetch either.
          # Only submodules .gitmodules declares (mupen64plus-nx carries a gitlink without one).
          paths=$(git -C src config -f .gitmodules --get-regexp '\.path$' 2>/dev/null | awk '{ print $2 }' || true)
          if [ -n "$paths" ]; then
            # shellcheck disable=SC2086
            git -C src submodule update -q --init --depth 1 -- $paths || git -C src submodule update -q --init -- $paths
            # shellcheck disable=SC2086
            git -C src submodule update -q --init --recursive --depth 1 -- $paths || echo "::warning::nested submodules incomplete"
          fi
          test "$(git -C src rev-parse HEAD)" = "$CORE_COMMIT"

      - name: Build and verify
        env:
          ABI: ${{ matrix.abi }}
          CORE: ${{ matrix.core }}
          CORE_COMMIT: ${{ matrix.commit }}
          BUILD_KIND: ${{ matrix.build }}
          JNI: ${{ matrix.jni }}
          ARGS: ${{ matrix.args }}
          EXTRA_ENV: ${{ matrix.env }}
          CPPFLAGS_EXTRA: ${{ matrix.cppflags }}
          PROFILE: ${{ matrix.profile }}
          CFLAGS_EXTRA: ${{ matrix.cflags }}
          LDFLAGS_EXTRA: ${{ matrix.ldflags }}
          MAKEVARS: ${{ matrix.makevars }}
        run: |
          set -euo pipefail
          mkdir -p out reports
          bin="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          read -r -a args <<< "$ARGS"
          read -r -a extra_env <<< "$EXTRA_ENV"
          read -r -a makevars <<< "$MAKEVARS"
          if [ "$BUILD_KIND" = "cmake" ]; then
            python3 scripts/core_build_policy.py prepare-cmake --root src --core "$CORE" --profile "$PROFILE"
            flags=("-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
            if [ -n "$CFLAGS_EXTRA" ]; then
              flags+=("-DCMAKE_C_FLAGS=$CFLAGS_EXTRA" "-DCMAKE_CXX_FLAGS=$CFLAGS_EXTRA")
            fi
            if [[ "$PROFILE" = o3* ]]; then
              flags+=("-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG" "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG")
            fi
            cmake -G "Unix Makefiles" -S src -B build \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-29 \
              -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
              "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 $LDFLAGS_EXTRA" \
              "-DCMAKE_MODULE_LINKER_FLAGS=-Wl,-z,max-page-size=16384 $LDFLAGS_EXTRA" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "${args[@]}" "${flags[@]}"
            build_cwd="$PWD/build"
            cp build/compile_commands.json reports/compile_commands.json
            # GNU Make must buffer each target; otherwise concurrent diagnostics can
            # splice into a verbose compiler/link command and corrupt the flag audit.
            cmake --build build --verbose -j"$(nproc)" -- --output-sync=target 2>&1 | tee reports/build.log
            lib=$(python3 scripts/core_build_policy.py select --nm "$bin/llvm-nm" --root build --pattern '*libretro*.so')
          else
            python3 scripts/core_build_policy.py ndk-flags \
              --application "src/$JNI/jni/Application.mk" --profile "$PROFILE" --cppflags="$CPPFLAGS_EXTRA"
            build_cwd="$PWD/src/$JNI/jni"
            env "${extra_env[@]}" "${NDK}/ndk-build" --no-print-directory --output-sync=target -j"$(nproc)" -C "src/$JNI/jni" \
              APP_ABI="$ABI" APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true NDK_CCACHE="$(command -v ccache)" V=1 "${makevars[@]}" 2>&1 | tee reports/build.log
            lib=$(python3 scripts/core_build_policy.py select --nm "$bin/llvm-nm" --root "src/$JNI/libs/$ABI" --pattern '*.so')
          fi
          target="out/${CORE}_libretro_android.so"
          cp "$lib" "$target"
          "$bin/llvm-strip" --strip-unneeded "$target"
          python3 scripts/check_elf_pages.py "$target"
          python3 scripts/core_build_policy.py report --nm "$bin/llvm-nm" --readelf "$bin/llvm-readelf" --binary "$target" --linked-library "$lib" \
            --log reports/build.log --profile "$PROFILE" --core "$CORE" --abi "$ABI" \
            --commit "$CORE_COMMIT" --ndk "$NDK_VERSION" --build-cwd "$build_cwd" --output reports/build.json
          cat reports/build.json
          ccache --show-stats

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: out/*.so
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-${{ matrix.artifact }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    permissions:
      contents: write
    needs: [plan, build]
    if: >-
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (inputs.profile == 'baseline' || github.event_name == 'push') &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: core-*
          path: artifacts

      - name: Package, sign and release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.CORES_SIGNING_KEY }}
          EXPECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::CORES_SIGNING_KEY is not set (scripts/cores_signing_key.sh)"; exit 1; }
          [ -f cores/signing-public.pem ] || { echo "::error::cores/signing-public.pem is missing (scripts/cores_signing_key.sh)"; exit 1; }
          # Never publish a signed partial release: require every selected core/ABI artifact.
          mapfile -t expected < <(jq -r '.include[] | "core-\(.core)-\(.abi)/\(.core)_libretro_android.so"' <<< "$EXPECTED_MATRIX")
          [ "${#expected[@]}" -gt 0 ] || { echo "::error::Empty core build matrix"; exit 1; }
          for path in "${expected[@]}"; do
            test -s "artifacts/$path" || { echo "::error::Missing built core artifact: $path"; exit 1; }
          done
          actual=$(find artifacts -type f -name '*_libretro_android.so' | wc -l)
          [ "$actual" -eq "${#expected[@]}" ] || {
            echo "::error::Expected ${#expected[@]} core builds, got $actual"
            exit 1
          }
          tag="cores-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          mkdir -p release
          entries='[]'
          for dir in artifacts/core-*; do
            name=${dir#artifacts/core-}
            abi=$(jq -r '.abis[]' cores/cores.json | while read -r a; do case "$name" in *-"$a") echo "$a";; esac; done | awk '{ print length, $0 }' | sort -rn | head -n1 | cut -d' ' -f2)
            core=${name%-"$abi"}
            so="$dir/${core}_libretro_android.so"
            [ -f "$so" ] || continue
            asset="${abi}--${core}_libretro_android.so.zip"
            (cd "$dir" && zip -q -X "../../release/$asset" "${core}_libretro_android.so")
            entries=$(jq -c --arg core "$core" --arg abi "$abi" --arg asset "$asset" \
              --arg sha "$(sha256sum "release/$asset" | cut -d' ' -f1)" --argjson size "$(stat -c %s "release/$asset")" \
              --slurpfile pins cores/cores.json \
              '. + [{ core: $core, abi: $abi, asset: $asset, sha256: $sha, size: $size,
                      commit: ($pins[0].cores[] | select(.core == $core) | .commit),
                      repo: ($pins[0].cores[] | select(.core == $core) | .repo) }]' <<< "$entries")
          done
          jq -n --arg tag "$tag" --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson cores "$entries" \
            '{ version: 1, tag: $tag, created: $created, cores: $cores }' > release/manifest.json
          printf '%s\n' "$SIGNING_KEY" > key.pem
          openssl dgst -sha256 -sign key.pem -out release/manifest.json.sig release/manifest.json
          rm -f key.pem
          openssl dgst -sha256 -verify cores/signing-public.pem -signature release/manifest.json.sig release/manifest.json
          jq -r '.cores[] | "\(.core) \(.abi)"' release/manifest.json
          gh release create "$tag" release/* --title "Cores $(date -u +%Y-%m-%d)" --latest=false \
            --notes "libretro cores built from cores/cores.json at ${GITHUB_SHA::7} (16 KB pages). Signed manifest for the app's core channel."
