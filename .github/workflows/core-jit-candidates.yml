name: ARM64 JIT candidates
on:
  pull_request:
    paths:
      - cores/cores.json
      - scripts/core_*.py
      - scripts/test_core_*.py
      - scripts/native_core_candidates/**
      - .github/workflows/cores.yml
      - .github/workflows/core-jit-candidates.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  candidates:
    strategy:
      fail-fast: false
      matrix:
        profile: [citra-arm64-jit, yabause-arm64-jit]
    # The called workflow declares gated main-only release jobs with write permission.
    # Its actual candidate build/plan jobs explicitly retain read-only access.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/cores.yml
    with:
      profile: ${{ matrix.profile }}
      publish: false
      publish_experimental: false
    secrets:
      CORES_SIGNING_KEY: ${{ secrets.CORES_SIGNING_KEY }}
