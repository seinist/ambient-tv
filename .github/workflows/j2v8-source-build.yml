name: Experimental J2V8 source build

on:
  pull_request:
    paths:
      - 'scripts/build_j2v8_from_source.py'
      - 'scripts/j2v8_source_audit.py'
      - 'smarttube_wrappers/j2v8/**'
      - '.github/workflows/j2v8-source-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j2v8-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v5
      - name: Install source build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git curl ca-certificates binutils build-essential python3 python-is-python3 xz-utils unzip
          df -h
      - name: Fetch pinned SmartTube Java and legacy JNI inputs
        run: bash scripts/fetch_smarttube_engine.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Compile pinned J2V8 and V8 native sources
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 scripts/build_j2v8_from_source.py --abi "$ABI" \
            --work "$RUNNER_TEMP/j2v8-source" --output j2v8-source-candidate \
            --shared third_party/smarttube/SharedModules --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-j2v8-source-${{ matrix.abi }}
          path: j2v8-source-candidate/
          if-no-files-found: error

  android-runtime:
    needs: source-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKIP_MPV_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: experimental-j2v8-source-*
          path: j2v8-artifacts
      - name: Fetch pinned wrapper and verify native candidates
        run: |
          set -euo pipefail
          bash scripts/fetch_smarttube_engine.sh
          bash scripts/fetch_libretrodroid.sh
          python3 scripts/build_j2v8_from_source.py --stage j2v8-artifacts \
            --shared third_party/smarttube/SharedModules --output "$RUNNER_TEMP/j2v8-test-jni"
      - name: Install Android SDK and emulator
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.1" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.22.1" "emulator" "system-images;android-35;google_apis;x86_64" ||
            "$sdkmanager" --channel=3 "platforms;android-37.1" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.22.1" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Run real Android JNI and JavaScript tests
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name j2v8-test --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd j2v8-test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/j2v8-emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 5; done'
          adb shell input keyevent 82
          ./gradlew :j2v8:connectedDebugAndroidTest -PAPK_ABI=x86_64 \
            -PJ2V8_SOURCE_TEST_DIR="$RUNNER_TEMP/j2v8-test-jni"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-j2v8-android-test
          path: |
            smarttube_wrappers/j2v8/build/reports/androidTests/
            smarttube_wrappers/j2v8/build/outputs/androidTest-results/
            ${{ runner.temp }}/j2v8-emulator.log
          if-no-files-found: warn
