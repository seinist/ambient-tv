name: Libretro native profiles
on:
  pull_request:
    paths:
      - libretrodroid_wrapper/build.gradle.kts
      - scripts/verify_libretro_native_profile.py
      - scripts/core_build_policy.py
      - scripts/core_acceleration_audit.py
      - scripts/core_link_evidence.py
      - scripts/fetch_libretrodroid.sh
      - scripts/instrument_libretro_trace.py
      - scripts/patches/libretrodroid/**
      - gradle/external-versions.properties
      - .github/workflows/libretro-native-profiles.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: libretro-native-profiles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [o3, thinlto, o3-thinlto]
        abi: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370" "cmake;3.22.1" ||
            "$sdkmanager" --channel=3 "platforms;android-37.0" "ndk;30.0.16248370" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/fetch_libretrodroid.sh
      - name: Compile experimental native library only
        env:
          PROFILE: ${{ matrix.profile }}
          ABI: ${{ matrix.abi }}
        run: |
          ./gradlew :libretrodroid:assembleRelease -PAPK_ABI="$ABI" \
            -PLIBRETRO_NATIVE_PROFILE="$PROFILE" -PLIBRETRO_NATIVE_EXPERIMENT=true --no-daemon
      - name: Verify configured native target compiler and linker flags
        env:
          PROFILE: ${{ matrix.profile }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find libretrodroid_wrapper/.cxx -type f -path "*/$ABI/build.ninja" -printf '%h\n')
          test "${#dirs[@]}" -eq 1
          python3 scripts/verify_libretro_native_profile.py \
            --ninja "$ANDROID_HOME/cmake/3.22.1/bin/ninja" \
            --build-dir "${dirs[0]}" --profile "$PROFILE" > native-profile.json
          cat native-profile.json
      - uses: actions/upload-artifact@v5
        with:
          name: native-profile-${{ matrix.profile }}-${{ matrix.abi }}
          path: native-profile.json
          if-no-files-found: error
          retention-days: 14
