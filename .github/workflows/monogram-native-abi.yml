name: Monogram native ABI compatibility

# Dedicated GPL-only build gate. Upstream source and dependencies are compiled
# exclusively in CI; no binaries are published while distribution review is open.
on:
  pull_request:
    paths:
      - "app/src/monogram/**"
      - "scripts/build_monogram_native.sh"
      - "scripts/merge_monogram_aars.py"
      - "scripts/monogram_size_audit.py"
      - "scripts/measure_monogram_apk.sh"
      - "app/build.gradle.kts"
      - "gradle/external-versions.properties"
      - ".github/workflows/monogram-native-abi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monogram-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 190
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
          - abi: armeabi-v7a
            rust: armv7-linux-androideabi
          - abi: x86
            rust: i686-linux-android
          - abi: x86_64
            rust: x86_64-linux-android
    env:
      MONOGRAM_ABIS: ${{ matrix.abi }}
      # This job compiles MTProto and the Kotlin adapter, not the unrelated MPV audio stack.
      # Otherwise prepareLocalAudio can trigger Meson/toolchain work on clean runners.
      SKIP_MPV_NATIVE: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android 37 and upstream-compatible NDK r28c
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --channel=3 "platforms;android-37.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4

      - name: Build only pinned native MTProto library
        run: |
          bash scripts/build_monogram_native.sh
          test -s app/libs/monogram-mtproto.aar
          python3 - <<'PY'
          import os, zipfile
          abi = os.environ['MONOGRAM_ABIS']
          with zipfile.ZipFile('app/libs/monogram-mtproto.aar') as jar:
              libs = sorted(p for p in jar.namelist() if p.startswith('jni/') and p.endswith('.so'))
              assert f'jni/{abi}/libmonogram_mtproto.so' in libs, libs
              assert all(p.startswith(f'jni/{abi}/') for p in libs), libs
              print(abi, 'native library', len(jar.read(f'jni/{abi}/libmonogram_mtproto.so')), 'bytes')
          PY
      # This is only an *early* ELF/AAR gate. Full 15 MB APK growth is measured
      # by ./build.sh monogram-size (requires all existing native media engines).
      - name: Audit native MTProto size (10 MB raw ELF budget)
        run: |
          python3 scripts/monogram_size_audit.py \
            --abi "${{ matrix.abi }}" \
            --aar app/libs/monogram-mtproto.aar --max-native-mb 10 \
            --json "monogram-native-size-${{ matrix.abi }}.json" \
            --markdown "monogram-native-size-${{ matrix.abi }}.md"
          cat "monogram-native-size-${{ matrix.abi }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native size report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: monogram-native-size-${{ matrix.abi }}
          path: monogram-native-size-${{ matrix.abi }}.*
          if-no-files-found: warn
          retention-days: 14

      - name: Compile Ambient TV opt-in Kotlin adapter
        run: |
          ./gradlew --no-daemon --no-configuration-cache :app:compileDebugKotlin \
            -PAPK_ABI="${{ matrix.abi }}" \
            -PMONOGRAM_NATIVE=1
