name: SVP native checks

on:
  pull_request:
    paths:
      - 'native/ambientsvp/**'
      - 'scripts/prepare_svp_sources.sh'
      - 'scripts/build_svp_android.sh'
      - 'scripts/profile_svp_android.sh'
      - 'scripts/svp_pgo_metadata.sh'
      - 'scripts/tests/test_svp_pgo_metadata.sh'
      - 'scripts/svp_dependency.py'
      - 'scripts/tests/test_svp_updates.py'
      - 'scripts/vendor_svp_licenses.sh'
      - 'gradle/external-versions.properties'
      - '.github/workflows/svp-native.yml'
  push:
    branches: [main]
    paths:
      - 'native/ambientsvp/**'
      - 'scripts/prepare_svp_sources.sh'
      - 'scripts/build_svp_android.sh'
      - 'scripts/profile_svp_android.sh'
      - 'scripts/svp_pgo_metadata.sh'
      - 'scripts/tests/test_svp_pgo_metadata.sh'
      - 'scripts/svp_dependency.py'
      - 'scripts/tests/test_svp_updates.py'
      - 'scripts/vendor_svp_licenses.sh'
      - 'gradle/external-versions.properties'
      - '.github/workflows/svp-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Matches the host x86 build workaround in build_svp_android.sh.
      RUSTFLAGS: "-C target-feature=+ssse3"
    steps:
      - uses: actions/checkout@v5
      - name: Verify source pin and updater integration
        run: |
          python3 scripts/svp_dependency.py
          bash scripts/tests/test_svp_pgo_metadata.sh
          python3 -m unittest discover -s scripts/tests -p test_svp_updates.py
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test native CPU fallback
        run: cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --no-default-features --lib --tests
      - name: Compile Vulkan path and run portable regressions
        run: cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib --tests
      - name: Validate integer GPU motion costs using Mesa software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib motion::tests::vulkan_candidate_costs_match_cpu -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib motion::tests::vulkan_super_phase_and_pyramid_costs_match_cpu -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib motion_select::tests::vulkan_ordered_selection_matches_cpu -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib motion_select::tests::chained_cost_and_selection_without_intermediate_readback -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib motion_select::tests::selected_complete_fields_enter_upstream_smoother -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib motion_search::tests::hierarchical_search_produces_complete_valid_fields -- --ignored --exact
          # Allow software Vulkan only in the Rust test build.
          export AMBIENTSVP_TEST_SOFTWARE_VULKAN=1
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::experimental_hierarchical_motion_reaches_streaming_synthesis -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::known_translation_quality_compares_upstream_and_experimental -- --ignored --exact --nocapture
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::translation_and_occlusion_quality_matrix -- --ignored --exact --nocapture
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::dual_output_matches_single_and_drops_prefetch_on_seek -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::adjacent_ready_source_pairs_match_serial_output -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::compact_motion_fields_match_float_fields -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::complete_output_overwrite_matches_clear_on_unaligned_planes -- --ignored --exact
      - name: Cross-check Android JNI and private Vulkan cache
        run: |
          rustup target add --toolchain stable aarch64-linux-android
          RUSTFLAGS="" cargo +stable check --manifest-path native/ambientsvp/Cargo.toml --release --locked --target aarch64-linux-android --lib
      - name: Test C adapters' shared helpers
        run: |
          set -euo pipefail
          bash -n scripts/prepare_svp_sources.sh
          bash -n scripts/build_svp_android.sh
          bash -n scripts/profile_svp_android.sh
          for test in svp_retry_test svp_planes_test; do
            cc -std=c11 -O2 -Wall -Wextra -Werror -I native/ambientsvp/include "native/ambientsvp/tests/$test.c" -o "/tmp/$test"
            "/tmp/$test"
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          src=native/ambientsvp/tests/svp_loader_test.c
          cc -std=c11 -O2 -Wall -Wextra -Werror -I native/ambientsvp/include "$src" -ldl -o "$tmp/loader"
          for variant in legacy direct mismatch incomplete; do
            mkdir "$tmp/$variant"
            flags=(-DMOCK_RUNTIME)
            expected=reject
            case "$variant" in
              legacy) expected=legacy;;
              direct) flags+=(-DDIRECT_APIS); expected=direct;;
              mismatch) flags+=(-DWRONG_ABI);;
              incomplete) flags+=(-DMISSING_REQUIRED);;
            esac
            cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -shared -I native/ambientsvp/include "${flags[@]}" "$src" -o "$tmp/$variant/libambientsvp.so"
            LD_LIBRARY_PATH="$tmp/$variant" "$tmp/loader" "$expected"
          done
      # Full synthesis/hardware throughput tests still require a physical GPU.
