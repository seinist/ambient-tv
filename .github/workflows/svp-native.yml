name: SVP native checks

on:
  pull_request:
    paths:
      - 'native/ambientsvp/**'
      - 'scripts/prepare_svp_sources.sh'
      - 'scripts/build_svp_android.sh'
      - '.github/workflows/svp-native.yml'
  push:
    branches: [main]
    paths:
      - 'native/ambientsvp/**'
      - 'scripts/prepare_svp_sources.sh'
      - 'scripts/build_svp_android.sh'
      - '.github/workflows/svp-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Matches the host x86 build workaround in build_svp_android.sh.
      RUSTFLAGS: "-C target-feature=+ssse3"
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test native CPU fallback
        run: cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --no-default-features --lib --tests
      - name: Compile Vulkan path and run portable regressions
        run: cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib --tests
      - name: Validate integer GPU motion costs using Mesa software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib motion::tests::vulkan_candidate_costs_match_cpu -- --ignored --exact
          # Allow software Vulkan only in the Rust test build.
          export AMBIENTSVP_TEST_SOFTWARE_VULKAN=1
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::dual_output_matches_single_and_drops_prefetch_on_seek -- --ignored --exact
          cargo +stable test --manifest-path native/ambientsvp/Cargo.toml --release --locked --lib pipelining_tests::compact_motion_fields_match_float_fields -- --ignored --exact
      - name: Test C adapters' shared helpers
        run: |
          set -euo pipefail
          bash -n scripts/prepare_svp_sources.sh scripts/build_svp_android.sh
          for test in svp_retry_test svp_planes_test; do
            cc -std=c11 -O2 -Wall -Wextra -Werror -I native/ambientsvp/include "native/ambientsvp/tests/$test.c" -o "/tmp/$test"
            "/tmp/$test"
          done
      # Full synthesis/hardware throughput tests still require a physical GPU.
