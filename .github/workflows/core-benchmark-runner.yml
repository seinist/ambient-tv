name: Core benchmark runner
on:
  pull_request:
    paths:
      - scripts/native_core_candidates/core_benchmark_runner.cpp
      - scripts/native_core_candidates/core_benchmark_input.h
      - scripts/native_core_candidates/core_benchmark_input_test.cpp
      - scripts/native_rewind/**
      - scripts/native_core_candidates/core_benchmark_vulkan.h
      - scripts/native_core_candidates/core_benchmark_vulkan_test.cpp
      - scripts/build_core_benchmark_runner.sh
      - scripts/run_core_benchmark.py
      - scripts/benchmark_core_matrix.py
      - .github/workflows/core-benchmark-runner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vulkan-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install software Vulkan driver and headers
        run: sudo apt-get update -qq && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Execute headless Vulkan submission tests
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          git -C "$tmp" fetch -q --depth 1 https://github.com/libretro/libretro-common.git ae22debd425c33fe355ac2e51d9a140d7e8b3fa6
          git -C "$tmp" show FETCH_HEAD:include/libretro.h > "$tmp/libretro.h"
          git -C "$tmp" show FETCH_HEAD:include/libretro_vulkan.h > "$tmp/libretro_vulkan.h"
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$tmp" scripts/native_core_candidates/core_benchmark_vulkan_test.cpp -pthread -lvulkan -o "$tmp/test"
          export VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$VK_DRIVER_FILES"
          "$tmp/test"
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$tmp" scripts/native_core_candidates/core_benchmark_input_test.cpp -o "$tmp/input-test"
          "$tmp/input-test"
  runner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v5
      - name: Install NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;30.0.16248370" > /dev/null || "$sdkmanager" --channel=3 "ndk;30.0.16248370" > /dev/null
      - name: Build diagnostic runner
        env:
          ABI: ${{ matrix.abi }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash scripts/build_core_benchmark_runner.sh "$ABI" out/core-benchmark-runner
          python3 scripts/check_elf_pages.py out/core-benchmark-runner
          python3 -m py_compile scripts/run_core_benchmark.py scripts/benchmark_core_matrix.py
      - uses: actions/upload-artifact@v7
        with:
          name: core-benchmark-runner-${{ matrix.abi }}
          path: out/core-benchmark-runner
          if-no-files-found: error
