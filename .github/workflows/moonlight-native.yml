name: Moonlight native verification

# Audit the native protocol and application integration, including shared input and build changes.
on:
  pull_request:
    paths:
      - 'moonlight_wrapper/**'
      - 'app/src/moonlight/**'
      - 'app/src/moonlightStub/**'
      - 'app/src/main/java/com/ambient/tv/moonlight/**'
      - 'app/src/main/java/com/ambient/tv/ui/moonlight/**'
      - 'app/src/main/res/values*/moonlight*.xml'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/test/java/com/ambient/tv/moonlight/**'
      - 'app/src/main/java/com/ambient/tv/companion/**'
      - 'app/src/main/java/com/ambient/tv/ui/gamepad/**'
      - 'app/src/main/java/com/ambient/tv/data/local/**'
      - 'app/src/main/java/com/ambient/tv/data/browse/**'
      - 'app/src/main/java/com/ambient/tv/ui/MainActivity.kt'
      - 'app/src/main/java/com/ambient/tv/ui/home/**'
      - 'app/src/main/java/com/ambient/tv/ui/search/**'
      - 'app/src/main/java/com/ambient/tv/ui/settings/**'
      - 'gradle/libs.versions.toml'
      - 'scripts/update_external_libraries.py'
      - 'scripts/fetch_moonlight_sources.sh'
      - 'scripts/build_moonlight_opus.sh'
      - 'scripts/tests/test_moonlight_fec_pool.py'
      - 'scripts/tests/test_moonlight_enet_packets.py'
      - 'scripts/tests/test_moonlight_udp_burst.py'
      - 'scripts/tests/test_moonlight_direct_and_simd.py'
      - 'scripts/tests/test_moonlight_nanors.py'
      - 'scripts/patches/moonlight/**'
      - 'gradle/external-versions.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/moonlight-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonlight-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-game-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: arm64
            abi: arm64-v8a
          - build: armv7
            abi: armeabi-v7a
          - build: x86
            abi: x86
          - build: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          if ! "$sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370"; then
            "$sdkmanager" --channel=3 "platforms;android-37.0" "ndk;30.0.16248370"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Ambient TV's mandatory LibretroDroid build dependency
        shell: bash
        run: bash scripts/fetch_libretrodroid.sh
      - name: Fetch exact Moonlight release and verify audited source patches
        shell: bash
        run: bash scripts/fetch_moonlight_sources.sh
      - name: Stress-test native FEC pool ownership and exhaustion
        if: matrix.abi == 'arm64-v8a'
        shell: bash
        run: python3 scripts/tests/test_moonlight_fec_pool.py third_party/moonlight-android/app/src/main/jni/moonlight-core/moonlight-common-c/src/ControlStream.c
      - name: Test native ENet packet allocation and resize
        if: matrix.abi == 'arm64-v8a'
        shell: bash
        run: python3 scripts/tests/test_moonlight_enet_packets.py third_party/moonlight-android/app/src/main/jni/moonlight-core/moonlight-common-c/enet
      - name: Test bounded video UDP burst receive on loopback
        if: matrix.abi == 'arm64-v8a'
        shell: bash
        run: python3 scripts/tests/test_moonlight_udp_burst.py third_party/moonlight-android/app/src/main/jni/moonlight-core/moonlight-common-c/src/VideoStream.c
      - name: Install host ARM64 regression test toolchain
        if: matrix.abi == 'arm64-v8a'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Test JNI picture copy, native downmix and adaptive UDP capacity
        if: matrix.abi == 'arm64-v8a'
        run: python3 scripts/tests/test_moonlight_direct_and_simd.py third_party/moonlight-android/app/src/main/jni/moonlight-core --arm64
      - name: Verify NanoRS reconstruction on host and ARM64 NEON
        if: matrix.abi == 'arm64-v8a'
        run: python3 scripts/tests/test_moonlight_nanors.py third_party/moonlight-android/app/src/main/jni/moonlight-core/moonlight-common-c/nanors --arm64
      - name: Verify upstream GameStream native dependencies
        shell: bash
        run: |
          set -euo pipefail
          root=third_party/moonlight-android/app/src/main/jni/moonlight-core
          test -s "$root/opus/${{ matrix.abi }}/libopus.a"
          test -f "$root/opus/source/CMakeLists.txt"
          test -s "$root/openssl/${{ matrix.abi }}/libcrypto.a"
          test -f "$root/moonlight-common-c/enet/include/enet/enet.h"
          grep -q 'this.uniqueId = uniqueId' third_party/moonlight-android/app/src/main/java/com/limelight/nvstream/http/NvHTTP.java
          grep -q 'Pinned host certificate changed' third_party/moonlight-android/app/src/main/java/com/limelight/nvstream/http/NvHTTP.java
      - name: Compile pinned native Moonlight protocol module
        shell: bash
        run: ./gradlew :moonlight_native:assembleDebug -PMOONLIGHT_NATIVE=true -PAPK_ABI=${{ matrix.build }} --no-daemon --stacktrace
      - name: Compile optimized native release for this ABI
        shell: bash
        run: ./gradlew :moonlight_native:assembleRelease -PMOONLIGHT_NATIVE=true -PAPK_ABI=${{ matrix.build }} --no-daemon --stacktrace
      - name: Check Moonlight JNI alignment
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t libs < <(find moonlight_wrapper/build -type f -name libmoonlight-core.so -path "*/${{ matrix.abi }}/*")
          test "${#libs[@]}" -gt 0 || { echo "::error::Missing Moonlight JNI library"; exit 1; }
          readelf="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 scripts/check_elf_page_alignment.py "$readelf" "${libs[@]}"
      - name: Compile application with native Moonlight
        env:
          SKIP_MPV_NATIVE: "1"
        shell: bash
        run: ./gradlew :app:compileDebugKotlin -PMOONLIGHT_NATIVE=true -PAPK_ABI=${{ matrix.build }} --no-daemon --stacktrace
      - name: Run native-enabled Moonlight JVM tests
        if: matrix.abi == 'arm64-v8a'
        env:
          SKIP_MPV_NATIVE: "1"
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --tests 'com.ambient.tv.moonlight.*' -PMOONLIGHT_NATIVE=true -PAPK_ABI=arm64 --no-daemon --stacktrace
      - name: Build verification-only APK (not for distribution)
        env:
          SKIP_MPV_NATIVE: "1"
        shell: bash
        # ProjectM, SVP and local mpv are unrelated to this audit. The production
        # build's native-media verification must remain enabled for published APKs.
        run: ./gradlew :app:assembleDebug -x :app:verifyAppNativeMediaInputs -PMOONLIGHT_NATIVE=true -PAPK_ABI=${{ matrix.build }} --no-daemon --stacktrace
      - name: Verify packaged ABI and upstream licenses
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          apks = list(pathlib.Path("app/build/outputs/apk/debug").rglob("*.apk"))
          assert apks, "No debug APK built"
          expected = "lib/" + os.environ["EXPECTED_ABI"] + "/libmoonlight-core.so"
          for apk in apks:
              with zipfile.ZipFile(apk) as package:
                  names = set(package.namelist())
                  assert expected in names, f"{apk}: Missing {expected}"
                  for notice in ("moonlight-android-LICENSE.txt", "moonlight-common-c-LICENSE.txt", "SOURCE-NOTICE.txt", "OpenSSL-LICENSE.txt", "Opus-LICENSE.txt", "native-artifacts.git-blobs"):
                      assert "assets/moonlight-licenses/" + notice in names, f"{apk}: Missing {notice}"
                  assert {n for n in names if n.endswith("/libmoonlight-core.so")} == {expected}, f"{apk}: Unexpected Moonlight ABI"
          PY
      - name: Check R8 release shrinking and JNI keep rules (no publishing)
        if: matrix.abi == 'arm64-v8a'
        env:
          SKIP_MPV_NATIVE: "1"
        shell: bash
        run: ./gradlew :app:minifyReleaseWithR8 -PMOONLIGHT_NATIVE=true -PAPK_ABI=arm64 --no-daemon --stacktrace
