name: PR checks

# Compiles the app/device audits and runs every JVM unit test on each pull request and on main.
# Packaging an APK needs native libraries that only ./build.sh produces (mpv/FFmpeg,
# Spotify, projectM, SVP), so this job stops at compile + unit tests; the full native
# release workflow calls ./build.sh to build and package those libraries.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "30.0.16248370"
  ANDROID_PLATFORM: "android-37.0"
  # Skips the local FFmpeg audio decoder build; the Vulkan probe still builds with the NDK.
  SKIP_MPV_NATIVE: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          echo "sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          # Surface the reason as an annotation; the raw log is not always reachable.
          # compileSdk 37 is not on the stable SDK channel yet; fall back to the preview channel.
          "$sdkmanager" --list --channel=3 2>/dev/null | tr '\r' '\n' | grep -E 'platforms;android-3[7-9]' | sort -u | sed 's/^/::notice title=channel3::/'
          if ! out=$("$sdkmanager" "platforms;${ANDROID_PLATFORM}" "ndk;${NDK_VERSION}" "cmake;3.22.1" 2>&1) &&
             ! out=$("$sdkmanager" --channel=3 "platforms;${ANDROID_PLATFORM}" "ndk;${NDK_VERSION}" "cmake;3.22.1" 2>&1); then
            echo "$out" | tr '\r' '\n' | grep -iE 'warning|error|fail|not found|unknown|available' | tail -15 | sed 's/^/::error title=sdkmanager::/'
            "$sdkmanager" --list 2>/dev/null | tr '\r' '\n' | grep -E '^ *(ndk;30|platforms;android-3[6-9])' | sort -u | sed 's/^/::error title=available::/'
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Script checks
        run: |
          bash -n build.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Fetch LibretroDroid
        # The games frontend (pinned Argosy fork plus scripts/patches/libretrodroid).
        run: ./scripts/fetch_libretrodroid.sh

      - name: Compile and run unit tests
        # One ABI keeps the Vulkan probe and LibretroDroid native builds short; unit tests do not depend on them.
        # :libretrodroid:assembleDebug builds its native library, so the core options patch compiles with the NDK.
        run: |
          set -o pipefail
          if ! ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :libretrodroid:assembleDebug -PAPK_ABI=arm64 --continue 2>&1 | tee gradle.log; then
            # Kotlin compile errors, failed tests and Gradle's own failure summary as annotations.
            grep -E '^e: |error: |FAILED$|tests completed|What went wrong' -A3 gradle.log | grep -v '^--$' | head -40 \
              | sed 's/%/%25/g; s/^/::error title=gradle::/'
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # The normal JVM job already builds ARM64. For the Vulkan/HDR output
  # development PR, additionally compile all remaining Android ABIs and
  # verify 16-KiB ELF LOAD-segment alignment. A green ARM64-only build
  # cannot prove that the native frontend works on the other release ABIs.
  native-vulkan-abis:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/libretro-vulkan-hdr-output'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            build: arm
          - abi: x86
            build: x86
          - abi: x86_64
            build: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply pinned LibretroDroid patches
        run: ./scripts/fetch_libretrodroid.sh
      - name: Build native LibretroDroid (${{ matrix.abi }})
        run: ./gradlew :libretrodroid:assembleDebug -PAPK_ABI=${{ matrix.build }} --no-daemon
      - name: Verify ELF 16-KiB alignment (${{ matrix.abi }})
        run: |
          set -euo pipefail
          readelf="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          mapfile -t libs < <(find libretrodroid_wrapper/build -type f -path "*/${{ matrix.abi }}/*.so" | sort -u)
          test "${#libs[@]}" -gt 0 || { echo "::error::No native output libraries found"; exit 1; }
          for lib in "${libs[@]}"; do
            echo "Checking $lib"
            "$readelf" -l "$lib" | awk '
              /LOAD[[:space:]]/ {
                align=$NF
                if (align !~ /^0x[0-9A-Fa-f]+$/) { print "Invalid LOAD alignment:", align > "/dev/stderr"; exit 1 }
                if (align !~ /^0x0*([4-9A-Fa-f][0-9A-Fa-f]{3,}|[1-9A-Fa-f][0-9A-Fa-f]{4,})$/) {
                  print "LOAD alignment below 16 KiB:", align > "/dev/stderr"; exit 1
                }
                seen=1
              }
              END { if (!seen) { print "No LOAD segments found" > "/dev/stderr"; exit 1 } }
            '
          done
