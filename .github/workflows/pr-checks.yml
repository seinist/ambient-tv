name: PR checks

# Compiles the app/device audits and runs every JVM unit test on each pull request and on main.
# Packaging an APK needs native libraries that only ./build.sh produces (mpv/FFmpeg,
# Spotify, projectM, SVP), so this job stops at compile + unit tests; the full native
# release workflow calls ./build.sh to build and package those libraries.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NDK_VERSION: "30.0.16248370"
  ANDROID_PLATFORM: "android-37.1"
  # Skips the local FFmpeg audio decoder build; the Vulkan probe still builds with the NDK.
  SKIP_MPV_NATIVE: "1"

jobs:
  games-changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.detect.outputs.native }}
      slang: ${{ steps.detect.outputs.slang }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect game/renderer changes by file, not PR title or branch name
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename')
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || git ls-files)
          else
            files=$(git ls-files)
          fi
          native=false
          slang=false
          if grep -Eq '^(app/src/(main|test)/java/com/ambient/tv/(games|ui/games|ui/gamepad)/|app/src/main/assets/games/|third_party_assets/game_shaders/|libretrodroid_wrapper/|scripts/(patches/(libretrodroid|librashader)/|native_libretro_vulkan/|host_vulkan_stubs/|native_rewind/|native_game_.*_test\.cpp|test_game_(audio|frame_pacing|filter_renderer|content|rewind|vulkan_presentation|vulkan_color|vulkan_sync|vulkan_slang)\.py|game_(filter_audit_sources|shader_output_wrapper)\.py|import_game_upscalers\.py|fetch_libretrodroid\.sh|instrument_libretro_trace\.py|verify_libretro_native_profile\.py|build_librashader_android\.sh|apply_librashader_patches\.py)|gradle/external-versions\.properties|\.github/workflows/pr-checks\.yml)' <<< "$files"; then
            native=true
          fi
          if grep -Eq '^(app/src/main/assets/games/slang/|app/src/main/java/com/ambient/tv/ui/games/|scripts/(native_libretro_vulkan/|host_vulkan_stubs/|native_game_vulkan_slang_test\.cpp|test_game_vulkan_slang\.py|patches/(libretrodroid|librashader)/|build_librashader_android\.sh|apply_librashader_patches\.py|check_game_slang\.py|tests/test_check_game_slang\.py|test_librashader_preset_api\.py)|gradle/external-versions\.properties|\.github/workflows/pr-checks\.yml)' <<< "$files"; then
            slang=true
          fi
          printf 'native=%s\nslang=%s\n' "$native" "$slang" >> "$GITHUB_OUTPUT"

  core-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compile core policy scripts
        run: |
          python3 -m py_compile scripts/core_build_policy.py scripts/core_release_incremental.py scripts/test_core_release_incremental.py scripts/core_acceleration_audit.py scripts/core_link_evidence.py scripts/core_hotpath_patches.py scripts/core_hotpath_remaining.py
      - name: Test core build and release policy
        run: |
          python3 -m unittest discover -s scripts -p 'test_core_build_policy.py'
          python3 -m unittest discover -s scripts -p 'test_core_release_incremental.py'
          python3 -m unittest discover -s scripts -p 'test_core_hotpath_patches.py'
          python3 -m unittest discover -s scripts -p 'test_core_hotpath_remaining.py'

  unit-tests:
    needs: core-policy
    runs-on: ubuntu-latest
    # Keep room for a bounded retry of Maven Central rate limiting.
    timeout-minutes: 65
    env:
      # Robolectric downloads android-all separately from Gradle; repo1 can return 429.
      ROBOLECTRIC_MAVEN_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          echo "sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          # Surface the reason as an annotation; the raw log is not always reachable.
          # The app uses 37.1 and the library modules use 37.0.
          "$sdkmanager" --list --channel=3 2>/dev/null | tr '\r' '\n' | grep -E 'platforms;android-3[7-9]' | sort -u | sed 's/^/::notice title=channel3::/'
          if ! out=$("$sdkmanager" "platforms;${ANDROID_PLATFORM}" "platforms;android-37.0" "ndk;${NDK_VERSION}" "cmake;3.22.1" 2>&1) &&
             ! out=$("$sdkmanager" --channel=3 "platforms;${ANDROID_PLATFORM}" "platforms;android-37.0" "ndk;${NDK_VERSION}" "cmake;3.22.1" 2>&1); then
            echo "$out" | tr '\r' '\n' | grep -iE 'warning|error|fail|not found|unknown|available' | tail -15 | sed 's/^/::error title=sdkmanager::/'
            "$sdkmanager" --list 2>/dev/null | tr '\r' '\n' | grep -E '^ *(ndk;30|platforms;android-3[6-9])' | sort -u | sed 's/^/::error title=available::/'
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Script checks
        run: |
          bash -n build.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_instrument_libretro_trace.py'
          python3 -m unittest discover -s scripts -p 'test_libretro_perf_tools.py'
          python3 scripts/import_game_system_icons.py --check
          python3 scripts/import_input_controller_artwork.py --check

      - name: Fetch LibretroDroid
        # The games frontend (pinned Argosy fork plus scripts/patches/libretrodroid).
        run: ./scripts/fetch_libretrodroid.sh

      - name: Validate game GLES and Vulkan shader sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools g++ libegl-dev libgles-dev libgl1-mesa-dri libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          python3 scripts/check_game_glsl.py
          python3 scripts/import_game_upscalers.py --check --validate
          python3 scripts/check_game_slang.py

      - name: Native input contracts
        # Real patched input code; fast host tests complement the existing Android ABI build.
        run: python3 scripts/test_libretro_input.py --sanitize

      - name: Native audio resampling contracts
        # Real patched PCM path, including unity conversion and empty-buffer bounds.
        run: python3 scripts/test_game_audio.py --sanitize

      - name: Native frame pacing contracts
        # Deterministic deadlines, fractional refresh rates and bounded catch-up.
        run: python3 scripts/test_game_frame_pacing.py --sanitize

      - name: Native rewind contracts
        # Exercise the exact Android codec/timeline with bounds and undefined-behavior checks.
        run: python3 scripts/test_game_rewind.py --sanitize --native-dir third_party/libretrodroid/src/main/cpp

      - name: Game content lifetime regressions
        # Real ROM loading and libretro-common VFS: ownership, short reads and descriptor reuse.
        run: python3 scripts/test_game_content.py --sanitize

      - name: Native Vulkan presentation contracts
        # Shared DAR/layout and frame-local native/GLES fallback, including resize and capture.
        run: python3 scripts/test_game_vulkan_presentation.py --sanitize

      - name: Native Vulkan synchronization contracts
        # Inject real wait/submit/retirement failures without a physical GPU or C-boundary throws.
        run: python3 scripts/test_game_vulkan_sync.py --sanitize

      - name: Vulkan source color contracts
        # Real VkCopyImage/Blit on Lavapipe, including sRGB backing/view mismatches.
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 scripts/test_game_vulkan_color.py

      - name: Game filter renderer regressions
        # Real GLES production renderer on Mesa, including paused filter changes and black borders.
        run: |
          python3 scripts/test_game_filter_renderer.py
          python3 scripts/test_game_filter_renderer.py --test-source scripts/native_game_hdr_color_test.cpp
          python3 scripts/test_game_filter_renderer.py --test-source scripts/native_game_hdr_filter_audit_test.cpp

      - name: Compile and run unit tests
        # One ABI keeps the Vulkan probe and LibretroDroid native builds short; unit tests do not depend on them.
        # :libretrodroid:assembleDebug builds its native library, so the core options patch compiles with the NDK.
        run: |
          set -o pipefail
          if ! bash scripts/ci_gradle_rate_limit_retry.sh :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :libretrodroid:testDebugUnitTest :libretrodroid:assembleDebug -PAPK_ABI=arm64 --continue 2>&1 | tee gradle.log; then
            # Kotlin compile errors, failed tests and Gradle's own failure summary as annotations.
            grep -E '^e: |error: |FAILED$|tests completed|What went wrong' -A3 gradle.log | grep -v '^--$' | head -40 \
              | sed 's/%/%25/g; s/^/::error title=gradle::/'
            exit 1
          fi

      - name: Upload input artwork previews
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: input-artwork-previews
          path: app/build/reports/input-artwork/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            libretrodroid_wrapper/build/reports/tests/
          retention-days: 7

  # The normal JVM job already builds ARM64. For the Vulkan/HDR output
  # development PR, additionally compile all remaining Android ABIs and
  # verify 16-KiB ELF LOAD-segment alignment. A green ARM64-only build
  # cannot prove that the native frontend works on the other release ABIs.
  native-vulkan-abis:
    needs: games-changes
    # All game-native changes are checked on PRs AND on main, even after branch merges.
    if: needs.games-changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            build: arm
          - abi: x86
            build: x86
          - abi: x86_64
            build: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply pinned LibretroDroid patches
        run: ./scripts/fetch_libretrodroid.sh
      - name: Build native LibretroDroid (${{ matrix.abi }})
        run: bash scripts/ci_gradle_rate_limit_retry.sh :libretrodroid:assembleDebug -PAPK_ABI=${{ matrix.build }} --no-daemon
      - name: Verify ELF 16-KiB alignment (${{ matrix.abi }})
        run: |
          set -euo pipefail
          readelf="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          mapfile -t libs < <(find libretrodroid_wrapper/build -type f -path "*/${{ matrix.abi }}/*.so" | sort -u)
          test "${#libs[@]}" -gt 0 || { echo "::error::No native output libraries found"; exit 1; }
          python3 scripts/check_elf_page_alignment.py "$readelf" "${libs[@]}"

  # The Rust Vulkan runtime is a separate library: the LibretroDroid NDK build can
  # pass while a missing/incompatible librashader.so would fail on device.
  # Build exactly the pinned Vulkan-only features, for every supported ABI.
  native-slang-runtime:
    needs: games-changes
    if: needs.games-changes.outputs.slang == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;30.0.16248370"
      - name: Build Vulkan-only librashader C runtime
        env:
          LIBRASHADER_ABIS: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          rustup --version
          cargo --version
          bash scripts/build_librashader_android.sh
          test -s "app/src/main/jniLibs/$LIBRASHADER_ABIS/liblibrashader_capi.so"
          file "app/src/main/jniLibs/$LIBRASHADER_ABIS/liblibrashader_capi.so"
          so="app/src/main/jniLibs/$LIBRASHADER_ABIS/liblibrashader_capi.so"
          raw=$(stat -c%s "$so")
          compressed=$(gzip -9 -c "$so" | wc -c)
          test "$raw" -le 12582912 || { echo "::error::Vulkan Slang exceeds 12 MiB per ABI"; exit 1; }
          echo "Vulkan Slang $LIBRASHADER_ABIS: $raw raw ELF bytes, $compressed gzip bytes (APK ZIP may differ)" >> "$GITHUB_STEP_SUMMARY"

  # Validate the actual pinned parser and C ABI, not just GLSL stage syntax.
  slang-preset-api:
    needs: games-changes
    if: needs.games-changes.outputs.slang == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Vulkan host validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
      - name: Compile pinned host-side Slang C ABI and parse every bundled preset
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^LIBRASHADER_COMMIT=//p' gradle/external-versions.properties)"
          test "${#pin}" -eq 40
          mkdir -p third_party/.librashader-host-src
          git -C third_party/.librashader-host-src init -q
          git -C third_party/.librashader-host-src remote add origin https://github.com/SnowflakePowered/librashader
          git -C third_party/.librashader-host-src fetch -q --depth 1 origin "$pin"
          git -C third_party/.librashader-host-src checkout -q FETCH_HEAD
          test "$(git -C third_party/.librashader-host-src rev-parse HEAD)" = "$pin"
          python3 scripts/apply_librashader_patches.py third_party/.librashader-host-src
          # Android builds verify the same checkout again on a cache hit.
          python3 scripts/apply_librashader_patches.py third_party/.librashader-host-src
          export CARGO_TARGET_DIR="$PWD/third_party/.librashader-host-target"
          cargo build --manifest-path third_party/.librashader-host-src/Cargo.toml \
            -p librashader-capi --release --locked --no-default-features --features runtime-vulkan
          python3 scripts/test_librashader_preset_api.py \
            third_party/.librashader-host-target/release/liblibrashader_capi.so
      - name: Render every bundled Slang preset
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          python3 scripts/test_game_vulkan_slang.py \
            --runtime third_party/.librashader-host-target/release/liblibrashader_capi.so
