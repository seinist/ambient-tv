name: projectM native checks

on:
  pull_request:
    paths:
      - 'native/ambientprojectm/**'
      - 'scripts/build_projectm_android.sh'
      - 'scripts/test_projectm_classic_composite.sh'
      - 'build.sh'
      - 'gradle/external-versions.properties'
      - 'app/src/main/java/com/ambient/tv/ui/common/projectm/**'
      - 'app/src/main/java/com/ambient/tv/ui/player/backend/AudioSpectrumAnalyzer.kt'
      - '.github/workflows/projectm-native.yml'
  push:
    branches: [main]
    paths:
      - 'native/ambientprojectm/**'
      - 'scripts/build_projectm_android.sh'
      - 'scripts/test_projectm_classic_composite.sh'
      - 'build.sh'
      - 'gradle/external-versions.properties'
      - '.github/workflows/projectm-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectm-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pcm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Native PCM ring and tap contracts
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie native/ambientprojectm/tests/pcm_tap_test.cpp -o /tmp/projectm-pcm-test
          /tmp/projectm-pcm-test
      - name: Validate script and build fingerprint
        run: |
          bash -n scripts/build_projectm_android.sh
          test "$(bash scripts/build_projectm_android.sh --fingerprint | wc -c)" -eq 41

  classic-composite-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install host GLES regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libegl-dev libgles-dev libgl1-mesa-dri python3-numpy
      - name: Compare actual MilkDrop classic composite paths
        run: bash scripts/test_projectm_classic_composite.sh

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECTM_FETCH_ASSETS: '0'
      NDK_VERSION: '30.0.16248370'
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Compile pinned and patched projectM for every ABI
        run: bash scripts/build_projectm_android.sh
      - name: Validate JNI symbol and native artifacts
        run: |
          set -euo pipefail
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            dir="app/src/main/jniLibs/$abi"
            test -s "$dir/libprojectM-4.so"
            test -s "$dir/libambientprojectm.so"
            "$nm" -D --defined-only "$dir/libambientprojectm.so" > "/tmp/projectm-symbols-$abi"
            grep -q 'Java_com_ambient_tv_ui_common_projectm_ProjectMNativeBridge_nativeSetFps' "/tmp/projectm-symbols-$abi"
            grep -q 'ambient_projectm_pcm_v1' "/tmp/projectm-symbols-$abi"
          done
      - name: Compile reference classic composite fallback on ARM64
        env:
          PROJECTM_ABIS: arm64-v8a
          PROJECTM_DIRECT_CLASSIC_COMPOSITE: 'OFF'
        run: |
          bash scripts/build_projectm_android.sh
          test -s app/src/main/jniLibs/arm64-v8a/libprojectM-4.so
          test ! -f app/src/main/jniLibs/.projectm-version

      - name: Compile developer PGO instrumentation on ARM64
        env:
          PROJECTM_ABIS: arm64-v8a
          PROJECTM_PGO_GENERATE: 'ON'
        run: |
          set -euo pipefail
          bash scripts/build_projectm_android.sh
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm" -D --defined-only app/src/main/jniLibs/arm64-v8a/libprojectM-4.so > /tmp/projectm-pgo-symbols
          grep -q 'ambient_projectm_write_profile' /tmp/projectm-pgo-symbols
          test ! -f app/src/main/jniLibs/.projectm-version
