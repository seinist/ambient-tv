name: Build release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (empty = version.properties, e.g. 1.0-beta)'
        type: string
      version_code:
        description: 'Android versionCode (empty = version.properties; increase for updates)'
        type: string

      paired_release:
        description: 'Build Full and Modular together (only after device and module availability review)'
        type: boolean
        default: false
      libretro_dex_candidate:
        description: 'Experimental LibretroDroid DEX candidate (requires module_candidate=libretrodroid)'
        type: boolean
        default: false
      vlc_dex_candidate:
        description: 'Experimental VLC DEX/JNI candidate (requires module_candidate=vlc)'
        type: boolean
        default: false
      module_candidate:
        description: 'Build one unsigned native module candidate from the signed Full APKs (main only)'
        type: choice
        default: none
        options: [none, monogram, smarttube, spotify, mpv, vlc, libretrodroid, projectm, svp, shaders, moonlight]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      CI: 'true'
      GRADLE_OPTS: '-Dorg.gradle.caching=true'
      NDK_VERSION: '30.0.16248370'
      MPV_SKIP_HOST_DEPS: '1'
      NATIVE_JOBS: '2'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check experimental Libretro DEX request
        if: inputs.libretro_dex_candidate
        env:
          MODULE: ${{ inputs.module_candidate }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$MODULE" = libretrodroid
          echo 'LIBRETRO_DEX_MODULE=1' >> "$GITHUB_ENV"

      - name: Check experimental VLC DEX request
        if: inputs.vlc_dex_candidate
        env:
          MODULE: ${{ inputs.module_candidate }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$MODULE" = vlc
          echo 'VLC_DEX_MODULE=1' >> "$GITHUB_ENV"

      - name: Check module candidate request
        if: inputs.module_candidate != '' && inputs.module_candidate != 'none'
        env:
          MODULE: ${{ inputs.module_candidate }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          echo 'MONOGRAM_NATIVE=1' >> "$GITHUB_ENV"
          if [[ "$MODULE" == spotify ]]; then echo 'SPOTIFY_NATIVE=1' >> "$GITHUB_ENV"; fi
          if [[ "$MODULE" == moonlight ]]; then
            python3 scripts/reconcile_moonlight_module_host.py --check
            echo 'MOONLIGHT_NATIVE=1' >> "$GITHUB_ENV"
          fi

      - name: Check paired release request
        if: inputs.paired_release
        env:
          MODULE: ${{ inputs.module_candidate }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ -z "$MODULE" || "$MODULE" == none ]]
          test -s cores/signing-public.pem
          python3 scripts/reconcile_moonlight_module_host.py --check
          echo 'MOONLIGHT_NATIVE=1' >> "$GITHUB_ENV"

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY_VERSION'
          import os, re
          from pathlib import Path
          props = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines()
                       if '=' in line and not line.lstrip().startswith('#'))
          version = os.environ['INPUT_VERSION'] or props['VERSION_NAME'].strip()
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          code = os.environ['INPUT_CODE'] or props['VERSION_CODE'].strip()
          if not re.fullmatch(r'[0-9][0-9A-Za-z._+-]{0,63}', version):
              raise SystemExit('Invalid version name')
          if not re.fullmatch(r'[1-9][0-9]*', code) or int(code) > 2100000000:
              raise SystemExit('Invalid Android versionCode')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'ORG_GRADLE_PROJECT_versionName={version}\nORG_GRADLE_PROJECT_versionCode={code}\n')
          PY_VERSION

      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.AMBIENT_TV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AMBIENT_TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMBIENT_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMBIENT_TV_KEY_PASSWORD }}
        run: |
          for key in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing signing secret: $key (see docs/github-releases.md)"
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake autopoint gettext libtool libtool-bin \
            pkg-config ninja-build cmake gperf nasm yasm bison flex texinfo \
            curl wget unzip zip xz-utils patch perl python3 python3-venv libssl-dev glslang-tools
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-ndk --locked

      - name: Install pinned Meson
        # Ubuntu 24.04 ships Meson 1.3.2; fontconfig requires >= 1.11.0.
        run: |
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install --disable-pip-version-check 'meson==1.11.0'
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/meson-venv/bin/meson" --version

      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --channel=3 'platforms;android-37.1' 'platforms;android-37.0' 'build-tools;37.0.0' "ndk;$NDK_VERSION" 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      # Exact-match caches only. The existing per-engine stamp/ABI checks still
      # run in build.sh. Never restore caches created by PR builds.
      - name: Resolve native toolchain cache identity
        id: native-tools
        run: |
          set -euo pipefail
          fingerprint="$({ rustc -Vv; cargo -V; cargo ndk --version; java -version; gcc --version; cmake --version; meson --version; ninja --version; python3 --version; "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version; echo "${ImageVersion:-unknown}"; echo "$NDK_VERSION"; } 2>&1 | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Resolve individual library input keys
        id: native-keys
        env:
          TOOLCHAIN: ${{ steps.native-tools.outputs.fingerprint }}
        run: python3 scripts/native_cache_keys.py --toolchain "$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Restore mpv build cache
        id: cache-mpv
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/.mpv-version
            app/src/main/jniLibs/*/.svp-mpv
            app/src/main/jniLibs/*/.projectm-pcm
            app/src/main/jniLibs/*/.ambientmpv-src
            app/src/main/jniLibs/*/.mpv-patches
            app/src/main/jniLibs/*/libmpv.so
            app/src/main/jniLibs/*/libambientmpv.so
            app/src/main/jniLibs/*/libav*.so
            app/src/main/jniLibs/*/libsw*.so
            app/src/main/jniLibs/*/libpostproc.so
            app/src/main/jniLibs/*/libass.so
            app/src/main/jniLibs/*/libplacebo.so
            app/src/main/jniLibs/*/libfreetype.so
            app/src/main/jniLibs/*/libharfbuzz.so
            app/src/main/jniLibs/*/libfribidi.so
            app/src/main/jniLibs/*/libssl.so
            app/src/main/jniLibs/*/libcrypto.so
            app/src/main/jniLibs/*/libfontconfig.so
            app/src/main/jniLibs/*/libxml2.so
            app/src/main/jniLibs/*/libunibreak.so
            app/src/main/jniLibs/*/liblua.so
            app/src/main/jniLibs/*/libcurl.so
            app/src/main/jniLibs/*/libmbed*.so
            app/src/main/jniLibs/*/libdav1d.so
            app/src/main/jniLibs/*/libc++_shared.so
            app/src/main/jniLibs/*/libzstd.so
            app/src/main/jniLibs/*/libpng*.so
            app/src/main/jniLibs/*/libshaderc*.so
            app/src/main/jniLibs/*/libvulkan*.so
            app/src/main/jniLibs/*/liblcms*.so
            app/src/main/jniLibs/*/libiconv.so
            app/src/main/jniLibs/*/libexpat.so
            app/src/main/jniLibs/*/libbz2.so
            .native/mpv-android/buildscripts/prefix/*/include
          key: ${{ format('ambient-native-main-v2-mpv-{0}', steps.native-keys.outputs.mpv) }}

      - name: Restore vlc build cache
        id: cache-vlc
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            app/libs/libvlc-vulkan.aar
            app/libs/.vlc-source-*
            app/libs/.projectm-pcm-vlc-*
            app/libs/.svp-vlc-*
          key: ${{ format('ambient-native-main-v2-vlc-{0}', steps.native-keys.outputs.vlc) }}

      - name: Restore projectm build cache
        id: cache-projectm
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/.projectm-version
            app/src/main/jniLibs/*/libprojectM*.so
            app/src/main/jniLibs/*/libambientprojectm.so
            app/src/main/assets/projectm
          key: ${{ format('ambient-native-main-v2-projectm-{0}', steps.native-keys.outputs.projectm) }}

      - name: Restore svp build cache
        id: cache-svp
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/*/libambientsvp.so
            app/src/main/jniLibs/*/.svp-engine
            app/src/main/assets/licenses/open-svpflow
          key: ${{ format('ambient-native-main-v2-svp-{0}', steps.native-keys.outputs.svp) }}

      - name: Restore shaders build cache
        id: cache-shaders
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/*/liblibrashader_capi.so
            app/src/main/jniLibs/*/.librashader-vulkan-pin
          key: ${{ format('ambient-native-main-v2-shaders-{0}', steps.native-keys.outputs.shaders) }}

      - name: Restore monogram build cache
        id: cache-monogram
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            app/libs/monogram-mtproto.aar
            app/libs/.monogram-native-version
          key: ${{ format('ambient-native-main-v2-monogram-{0}', steps.native-keys.outputs.monogram) }}

      - name: Restore spotify build cache
        id: cache-spotify
        if: github.ref == 'refs/heads/main' && env.SPOTIFY_NATIVE == '1' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/.spotify-rusty
            app/src/main/jniLibs/.spotify-pcm-v39
            app/src/main/jniLibs/*/libspotify_receiver_core.so
          key: ${{ format('ambient-native-main-v2-spotify-{0}', steps.native-keys.outputs.spotify) }}

      - name: Restore libretrodroid build cache
        id: cache-libretrodroid
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/libretrodroid/src
            third_party/libretrodroid/.ambient-libretrodroid
            third_party/libretrodroid/consumer-rules.pro
            libretrodroid_wrapper/.cxx
          key: ${{ format('ambient-native-main-v2-libretrodroid-{0}', steps.native-keys.outputs.libretrodroid) }}

      - name: Restore smarttube build cache
        id: cache-smarttube
        if: github.ref == 'refs/heads/main' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/smarttube/.engine-version
            third_party/smarttube/MediaServiceCore
            third_party/smarttube/SharedModules
          key: ${{ format('ambient-native-main-v2-smarttube-{0}', steps.native-keys.outputs.smarttube) }}

      - name: Check build scripts
        run: |
          bash -n build.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Build signed release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          PAIRED_RELEASE: ${{ inputs.paired_release }}
          KEYSTORE_BASE64: ${{ secrets.AMBIENT_TV_KEYSTORE_BASE64 }}
          AMBIENT_TV_KEYSTORE_FILE: ${{ runner.temp }}/ambient-tv-release.jks
          AMBIENT_TV_KEYSTORE_PASSWORD: ${{ secrets.AMBIENT_TV_KEYSTORE_PASSWORD }}
          AMBIENT_TV_KEY_ALIAS: ${{ secrets.AMBIENT_TV_KEY_ALIAS }}
          AMBIENT_TV_KEY_PASSWORD: ${{ secrets.AMBIENT_TV_KEY_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$AMBIENT_TV_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$AMBIENT_TV_KEYSTORE_FILE"
          bash build.sh release
          test -s dist/update.json
          if [[ "${PAIRED_RELEASE:-false}" == true ]]; then
            REVIEWED_MODULAR_RELEASE=1 bash build.sh release-modular
            python3 scripts/verify_paired_apk_release.py --full dist --modular dist/modular --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          fi

      - name: Save mpv build cache
        if: github.ref == 'refs/heads/main' && steps.cache-mpv.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/.mpv-version
            app/src/main/jniLibs/*/.svp-mpv
            app/src/main/jniLibs/*/.projectm-pcm
            app/src/main/jniLibs/*/.ambientmpv-src
            app/src/main/jniLibs/*/.mpv-patches
            app/src/main/jniLibs/*/libmpv.so
            app/src/main/jniLibs/*/libambientmpv.so
            app/src/main/jniLibs/*/libav*.so
            app/src/main/jniLibs/*/libsw*.so
            app/src/main/jniLibs/*/libpostproc.so
            app/src/main/jniLibs/*/libass.so
            app/src/main/jniLibs/*/libplacebo.so
            app/src/main/jniLibs/*/libfreetype.so
            app/src/main/jniLibs/*/libharfbuzz.so
            app/src/main/jniLibs/*/libfribidi.so
            app/src/main/jniLibs/*/libssl.so
            app/src/main/jniLibs/*/libcrypto.so
            app/src/main/jniLibs/*/libfontconfig.so
            app/src/main/jniLibs/*/libxml2.so
            app/src/main/jniLibs/*/libunibreak.so
            app/src/main/jniLibs/*/liblua.so
            app/src/main/jniLibs/*/libcurl.so
            app/src/main/jniLibs/*/libmbed*.so
            app/src/main/jniLibs/*/libdav1d.so
            app/src/main/jniLibs/*/libc++_shared.so
            app/src/main/jniLibs/*/libzstd.so
            app/src/main/jniLibs/*/libpng*.so
            app/src/main/jniLibs/*/libshaderc*.so
            app/src/main/jniLibs/*/libvulkan*.so
            app/src/main/jniLibs/*/liblcms*.so
            app/src/main/jniLibs/*/libiconv.so
            app/src/main/jniLibs/*/libexpat.so
            app/src/main/jniLibs/*/libbz2.so
            .native/mpv-android/buildscripts/prefix/*/include
          key: ${{ steps.cache-mpv.outputs.cache-primary-key }}

      - name: Save vlc build cache
        if: github.ref == 'refs/heads/main' && steps.cache-vlc.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            app/libs/libvlc-vulkan.aar
            app/libs/.vlc-source-*
            app/libs/.projectm-pcm-vlc-*
            app/libs/.svp-vlc-*
          key: ${{ steps.cache-vlc.outputs.cache-primary-key }}

      - name: Save projectm build cache
        if: github.ref == 'refs/heads/main' && steps.cache-projectm.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/.projectm-version
            app/src/main/jniLibs/*/libprojectM*.so
            app/src/main/jniLibs/*/libambientprojectm.so
            app/src/main/assets/projectm
          key: ${{ steps.cache-projectm.outputs.cache-primary-key }}

      - name: Save svp build cache
        if: github.ref == 'refs/heads/main' && steps.cache-svp.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/*/libambientsvp.so
            app/src/main/jniLibs/*/.svp-engine
            app/src/main/assets/licenses/open-svpflow
          key: ${{ steps.cache-svp.outputs.cache-primary-key }}

      - name: Save shaders build cache
        if: github.ref == 'refs/heads/main' && steps.cache-shaders.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/*/liblibrashader_capi.so
            app/src/main/jniLibs/*/.librashader-vulkan-pin
          key: ${{ steps.cache-shaders.outputs.cache-primary-key }}

      - name: Save monogram build cache
        if: github.ref == 'refs/heads/main' && steps.cache-monogram.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            app/libs/monogram-mtproto.aar
            app/libs/.monogram-native-version
          key: ${{ steps.cache-monogram.outputs.cache-primary-key }}

      - name: Save spotify build cache
        if: github.ref == 'refs/heads/main' && env.SPOTIFY_NATIVE == '1' && steps.cache-spotify.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/.spotify-rusty
            app/src/main/jniLibs/.spotify-pcm-v39
            app/src/main/jniLibs/*/libspotify_receiver_core.so
          key: ${{ steps.cache-spotify.outputs.cache-primary-key }}

      - name: Save libretrodroid build cache
        if: github.ref == 'refs/heads/main' && steps.cache-libretrodroid.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/libretrodroid/src
            third_party/libretrodroid/.ambient-libretrodroid
            third_party/libretrodroid/consumer-rules.pro
            libretrodroid_wrapper/.cxx
          key: ${{ steps.cache-libretrodroid.outputs.cache-primary-key }}

      - name: Save smarttube build cache
        if: github.ref == 'refs/heads/main' && steps.cache-smarttube.outputs.cache-hit != 'true' && (inputs.module_candidate == '' || inputs.module_candidate == 'none')
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/smarttube/.engine-version
            third_party/smarttube/MediaServiceCore
            third_party/smarttube/SharedModules
          key: ${{ steps.cache-smarttube.outputs.cache-primary-key }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ambient-tv-release-${{ github.run_id }}
          path: |
            dist/*.apk
            dist/update.json
            dist/modular/*.apk
            dist/modular/update-modular.json
          if-no-files-found: error
          compression-level: 0

      - name: Build native module candidate
        if: inputs.module_candidate != '' && inputs.module_candidate != 'none'
        env:
          MODULE: ${{ inputs.module_candidate }}
        run: |
          set -euo pipefail
          case "$MODULE" in
            monogram) ./gradlew :app:exportMonogramAdapterDex -PAPK_ABI=arm64 ;;
            smarttube) ./gradlew :app:exportSmartTubeAdapterDex -PAPK_ABI=arm64 ;;
            vlc) if [[ "${VLC_DEX_MODULE:-0}" == 1 ]]; then ./gradlew :app:exportVlcAdapterDex -PAPK_ABI=arm64; fi ;;
            libretrodroid) if [[ "${LIBRETRO_DEX_MODULE:-0}" == 1 ]]; then ./gradlew :app:exportLibretroAdapterDex -PAPK_ABI=arm64; fi ;;
          esac
          python3 scripts/module_corresponding_source.py --module "$MODULE" --sha "$GITHUB_SHA" --output source-candidate/corresponding-source.tar.gz --notices source-candidate/notices
          notices=source-candidate/notices
          args=()
          if [[ "${VLC_DEX_MODULE:-0}" == 1 ]]; then args+=(--vlc-dex); fi
          if [[ "${LIBRETRO_DEX_MODULE:-0}" == 1 ]]; then args+=(--libretro-dex); fi
          python3 scripts/prepare_native_module_release.py build --module "$MODULE" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" --output module-candidate --dist dist --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" --notices "$notices" --source source-candidate/corresponding-source.tar.gz "${args[@]}"

      - name: Upload native module candidate
        if: inputs.module_candidate != '' && inputs.module_candidate != 'none'
        uses: actions/upload-artifact@v5
        with:
          name: native-module-candidate-${{ inputs.module_candidate }}-${{ github.run_id }}
          path: module-candidate/
          if-no-files-found: error
          compression-level: 0

      - name: Create release draft
        if: inputs.module_candidate == '' || inputs.module_candidate == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAIRED_RELEASE: ${{ inputs.paired_release }}
        run: |
          # Derive the tag from build.sh output, including its stable/pre-release build number.
          shopt -s nullglob
          apks=(dist/ambient-tv-arm64-*.apk)
          [[ ${#apks[@]} == 1 ]]
          label="${apks[0]#dist/ambient-tv-arm64-}"
          label="${label%.apk}"
          tag="v$label"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          args=(--draft --title "Ambient TV $label" --generate-notes)
          if [[ "$label" == *-* ]]; then args+=(--prerelease); fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          assets=(dist/*.apk dist/update.json)
          if [[ "${PAIRED_RELEASE:-false}" == true ]]; then
            test -s dist/modular/update-modular.json
            assets+=(dist/modular/*.apk dist/modular/update-modular.json)
            test "${#assets[@]}" = 10
          fi
          gh release create "$tag" "${assets[@]}" "${args[@]}"
